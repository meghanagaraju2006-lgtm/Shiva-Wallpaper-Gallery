<!DOCTYPE html>
<html>
<head>
<title>Shiva Wallpaper Gallery</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;background:#0f0f0f;color:#fff;font-family:Arial}
header{text-align:center;padding:25px;background:#1a1a2e}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:15px;padding:20px}
.card{background:#1e1e1e;border-radius:12px;overflow:hidden}
.card img{width:100%;height:350px;object-fit:cover;background:#222}
.info{padding:10px;display:flex;justify-content:space-between;align-items:center}
.btn{background:#ff6a00;color:#fff;padding:6px 12px;border-radius:6px;text-decoration:none;font-size:12px}
</style>
</head>
<body>
<header><h1>🔱 Shiva Wallpaper Gallery 🔱</h1><p id="count">Loading HD Wallpapers...</p></header>
<div id="gallery" class="gallery"></div>
<script>
async function load(){
  const res = await fetch('https://api.github.com/repos/meghanagaraju2006-lgtm/Shiva-Wallpaper-Gallery/contents?t='+Date.now());
  const files = await res.json();
  const gal = document.getElementById('gallery');
  gal.innerHTML='';
  let c=0;
  files.filter(f=>/\.(jpg|jpeg|png|webp)$/i.test(f.name)).forEach(f=>{
    c++;
    // FINAL FIX - use raw github with proper encoding
    const imgUrl = `https://raw.githubusercontent.com/meghanagaraju2006-lgtm/Shiva-Wallpaper-Gallery/main/${encodeURIComponent(f.name)}`;
    gal.innerHTML+=`<div class="card"><img src="${imgUrl}" loading="lazy"><div class="info"><span style="font-size:11px;width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${f.name}</span><a class="btn" href="${imgUrl}" download>Download</a></div></div>`;
  });
  document.getElementById('count').innerText=c+' HD Wallpapers - Har Har Mahadev';
}
load();
</script>
</body>
</html>
