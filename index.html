<!DOCTYPE html>
<html>
<head>
<title>Shiva Wallpaper Gallery</title>
<style>
body{margin:0;background:#0f0f0f;color:#fff;font-family:Arial}
header{text-align:center;padding:30px;background:#1a1a2e}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:15px;padding:20px}
.card{background:#1e1e1e;border-radius:12px;overflow:hidden}
.card img{width:100%;height:350px;object-fit:cover}
.card .info{padding:10px;display:flex;justify-content:space-between}
.btn{background:#ff6a00;color:#fff;padding:6px 12px;border-radius:6px;text-decoration:none}
</style>
</head>
<body>
<header><h1>🔱 Shiva Wallpaper Gallery 🔱</h1></header>
<div id="gallery" class="gallery"></div>
<script>
async function loadImages(){
  const res = await fetch(`https://api.github.com/repos/meghanagaraju2006-lgtm/Shiva-Wallpaper-Gallery/contents`);
  const files = await res.json();
  const gallery = document.getElementById("gallery");
  gallery.innerHTML="";
  files.filter(f=>f.name.match(/\.(jpg|jpeg|png|webp)$/i)).forEach(file=>{
    gallery.innerHTML+=`<div class="card"><img src="${file.download_url}"><div class="info"><p>${file.name}</p><a class="btn" href="${file.download_url}" download>Download</a></div></div>`;
  });
}
loadImages();
</script>
</body>
</html>
